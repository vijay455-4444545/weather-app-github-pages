<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather Forecast – Monsoon Season</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Weather Forecast – Monsoon Season</h1>
    <p class="subtitle">
      Stay updated with live weather and heavy rain alerts during the monsoon season.
    </p>

    <input id="cityInput" type="text" placeholder="Enter city (e.g. Bengaluru)" />
    <button id="getWeatherBtn">Get Weather</button>

    <section id="currentWeather" class="card"></section>
    <section id="forecast" class="card"></section>
  </div>

  <script src="script.js"></script>
</body>
</html>
